name: Build modern WebUI release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing modern-webui-v* tag to rebuild and populate; leave empty for a CI-only artifact"
        required: false
        type: string
      release_id:
        description: "Release ID for an untagged CI artifact; ignored when release_tag is set"
        required: false
        type: string
  push:
    tags:
      - "modern-webui-v*"

permissions:
  contents: read

jobs:
  build-release-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl file patch perl rsync cpio unzip \
            bzip2 xz-utils python3 qemu-user

      - name: Fetch and verify pinned sources
        run: components/dropbear/fetch-sources.sh

      - name: Restore shared PPC cross-toolchain cache
        id: toolchain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            components/dropbear/buildroot/dl
            components/dropbear/output-buildroot/host
            components/dropbear/output-buildroot/.config
          key: pm3000-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('components/dropbear/configs/buildroot-pm3000_defconfig', 'components/dropbear/patches/**', 'components/dropbear/fetch-sources.sh', 'components/dropbear/build-toolchain.sh', 'components/dropbear/sources/SHA256SUMS.required') }}

      - name: Build PPC cross-toolchain on cache miss
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: components/dropbear/build-toolchain.sh

      - name: Derive PM3000 release ID
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          CI_RELEASE_ID: ${{ inputs.release_id }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            case "$RELEASE_TAG" in
              modern-webui-v*) release_id=${RELEASE_TAG#modern-webui-v} ;;
              *) echo "Refusing unexpected release tag: $RELEASE_TAG" >&2; exit 1 ;;
            esac
          else
            release_id=${CI_RELEASE_ID:-ci-${GITHUB_RUN_NUMBER}}
          fi
          case "$release_id" in
            ''|*[!A-Za-z0-9._-]*|.|..) echo "Unsafe release ID: $release_id" >&2; exit 1 ;;
          esac
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Build and verify modern PM3000 release
        run: modern-WebUI/deploy/build-release.sh "${{ steps.version.outputs.release_id }}" modern-WebUI/dist

      - name: Verify packaged GSP helper ABI
        run: |
          set -euo pipefail
          shopt -s nullglob
          releases=(modern-WebUI/dist/pm3000-release-*.tar)
          [ "${#releases[@]}" -eq 1 ] || {
            echo "Expected exactly one release TAR" >&2
            exit 1
          }
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tar -xf "${releases[0]}" -C "$work" bin/pm3000-gsp-session-helper
          helper=$work/bin/pm3000-gsp-session-helper
          file "$helper" | grep -F 'ELF 32-bit MSB executable, PowerPC'
          dynamic=$(readelf -d "$helper")
          expected_needed=$(printf '%s\n' libc.so.6 libgsp_auth.so)
          actual_needed=$(printf '%s\n' "$dynamic" | sed -n 's/.*Shared library: \[\([^]]*\)\].*/\1/p' | LC_ALL=C sort)
          [ "$actual_needed" = "$expected_needed" ] || {
            echo "Unexpected GSP helper DT_NEEDED set:" >&2
            printf '%s\n' "$actual_needed" >&2
            exit 1
          }
          readelf -l "$helper" | grep -F 'Requesting program interpreter: /lib/ld.so.1'
          expected_undefined=$(printf '%s\n' \
            close@GLIBC_2.0 \
            getdtablesize@GLIBC_2.0 \
            geteuid@GLIBC_2.0 \
            getppid@GLIBC_2.0 \
            getpwnam@GLIBC_2.0 \
            getsockopt@GLIBC_2.0 \
            getuid@GLIBC_2.0 \
            gsp_auth_session_create_username \
            gsp_auth_session_destroy \
            gsp_auth_session_get_sid \
            gsp_auth_session_set_auth_type \
            gsp_auth_session_set_cpid \
            gsp_auth_session_set_mpid \
            gsp_auth_session_set_type \
            memset@GLIBC_2.0 \
            read@GLIBC_2.0 \
            signal@GLIBC_2.0 \
            strlen@GLIBC_2.0 \
            write@GLIBC_2.0)
          actual_undefined=$(readelf --wide --dyn-syms "$helper" | awk '$7 == "UND" && $8 != "" { print $8 }' | LC_ALL=C sort -u)
          [ "$actual_undefined" = "$expected_undefined" ] || {
            echo "Unexpected GSP helper undefined-symbol set:" >&2
            printf '%s\n' "$actual_undefined" >&2
            exit 1
          }

      - name: Verify packaged ACME broker ABI
        run: |
          set -euo pipefail
          shopt -s nullglob
          releases=(modern-WebUI/dist/pm3000-release-*.tar)
          [ "${#releases[@]}" -eq 1 ] || {
            echo "Expected exactly one release TAR" >&2
            exit 1
          }
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          tar -xf "${releases[0]}" -C "$work" bin/pm3000-acme-admin
          broker=$work/bin/pm3000-acme-admin
          file "$broker" | grep -F 'ELF 32-bit MSB executable, PowerPC'
          file "$broker" | grep -F 'statically linked' || {
            echo "Packaged ACME broker is not a static executable" >&2
            exit 1
          }
          if readelf -l "$broker" | grep -q 'Requesting program interpreter:'; then
            echo "Packaged ACME broker unexpectedly has an interpreter" >&2
            exit 1
          fi
          if readelf -d "$broker" 2>&1 | grep -q '(NEEDED)'; then
            echo "Packaged ACME broker unexpectedly has DT_NEEDED entries" >&2
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pm3000-modern-${{ github.run_id }}
          path: |
            modern-WebUI/dist/pm3000-release-*.tar
            modern-WebUI/dist/pm3000-release-*.tar.sha256
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/modern-webui-v') || inputs.release_tag != ''
    needs: build-release-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pm3000-modern-${{ github.run_id }}
          path: dist

      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            modern-webui-v*) ;;
            *) echo "Refusing unexpected release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.tar dist/*.tar.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.tar dist/*.tar.sha256 \
              --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG" \
              --generate-notes --verify-tag
          fi
