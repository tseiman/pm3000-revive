name: Build Dropbear milestone

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing dropbear-v* tag to rebuild and populate; leave empty for a test build"
        required: false
        type: string
  push:
    tags:
      - "dropbear-v*"

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: components/dropbear
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl file patch perl rsync cpio unzip \
            bzip2 xz-utils python3

      - name: Fetch and verify pinned sources
        run: ./fetch-sources.sh

      - name: Restore cross-toolchain cache
        id: toolchain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            components/dropbear/buildroot/dl
            components/dropbear/output-buildroot/host
            components/dropbear/output-buildroot/.config
          key: pm3000-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('components/dropbear/configs/buildroot-pm3000_defconfig', 'components/dropbear/patches/**', 'components/dropbear/fetch-sources.sh', 'components/dropbear/build-toolchain.sh', 'components/dropbear/sources/SHA256SUMS.required') }}

      - name: Build cross-toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: ./build-toolchain.sh

      - name: Build Dropbear
        run: ./build-dropbear.sh

      - name: Verify binaries and SSH behavior
        run: ./verify.sh

      - name: Package release archives
        run: |
          ./package.sh
          cd dist
          sha256sum -c SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pm3000-dropbear-${{ github.run_id }}
          path: |
            components/dropbear/dist/*.tar.xz
            components/dropbear/dist/*.sha256
            components/dropbear/dist/SHA256SUMS
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/dropbear-v') || inputs.release_tag != ''
    needs: build-test-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pm3000-dropbear-${{ github.run_id }}
          path: dist

      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            dropbear-v*) ;;
            *) echo "Refusing unexpected release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/*.tar.xz dist/*.sha256 dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              dist/*.tar.xz dist/*.sha256 dist/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
