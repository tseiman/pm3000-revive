name: Build Dropbear milestone

on:
  workflow_dispatch:
  push:
    tags:
      - "dropbear-v*"

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: components/dropbear
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl file patch perl rsync cpio unzip \
            bzip2 xz-utils python3 docker.io

      - name: Fetch and verify pinned sources
        run: ./fetch-sources.sh

      - name: Build cross-toolchain
        run: ./build-toolchain.sh

      - name: Build Dropbear
        run: ./build-dropbear.sh

      - name: Verify binaries and SSH behavior
        run: ./verify.sh

      - name: Package release archives
        run: |
          ./package.sh
          cd dist
          sha256sum -c SHA256SUMS

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pm3000-dropbear-${{ github.sha }}
          path: |
            components/dropbear/dist/*.tar.xz
            components/dropbear/dist/*.sha256
            components/dropbear/dist/SHA256SUMS
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/dropbear-v')
    needs: build-test-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pm3000-dropbear-${{ github.sha }}
          path: dist

      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.xz dist/*.sha256 dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
