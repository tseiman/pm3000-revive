# Apache 2.2 pilot mapping; legacy / remains untouched.
SetEnvIf Authorization "^(.*)$" HTTP_AUTHORIZATION=$1

ScriptAlias /api/v1 "/mnt/hdUser/pm3000-revive/webui/current/bin/pm3000-rest"
Alias /modern/ "/mnt/hdUser/pm3000-revive/webui/current/web/"

<Directory "/mnt/hdUser/pm3000-revive/webui/current/web">
    Options -Indexes
    AllowOverride None
    Order deny,allow
    Allow from all
</Directory>

<Directory "/mnt/hdUser/pm3000-revive/webui/current/bin">
    Options +ExecCGI -Indexes
    AcceptPathInfo On
    AllowOverride None
    Order deny,allow
    Allow from all
</Directory>

<Location /modern/>
    SSLRequireSSL
</Location>

<Location /api/v1/>
    SSLRequireSSL
</Location>
