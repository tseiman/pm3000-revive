# Apache 2.2 pilot mapping; legacy / remains untouched.
SetEnvIf Authorization "^(.*)$" HTTP_AUTHORIZATION=$1
SetEnvIf Cookie "^(.*)$" HTTP_COOKIE=$1
SetEnvIf X-CSRF-Token "^(.*)$" HTTP_X_CSRF_TOKEN=$1

Alias /.well-known/acme-challenge/ "/mnt/hdUser/pm3000-revive/acme-http-01/"

<Directory "/mnt/hdUser/pm3000-revive/acme-http-01">
    Options -Indexes -ExecCGI
    AllowOverride None
    Order deny,allow
    Allow from all
</Directory>

ScriptAlias /api/v1 "/mnt/hdUser/pm3000-revive/webui/current/bin/pm3000-rest"
Alias /modern/ "/mnt/hdUser/pm3000-revive/webui/current/web/"

<Directory "/mnt/hdUser/pm3000-revive/webui/current/web">
    Options -Indexes
    DirectoryIndex index.html
    AllowOverride None
    Order deny,allow
    Allow from all
</Directory>

<Directory "/mnt/hdUser/pm3000-revive/webui/current/bin">
    Options +ExecCGI -Indexes
    AcceptPathInfo On
    AllowOverride None
    Order deny,allow
    Allow from all
</Directory>

<Location /modern/>
    SSLRequireSSL
</Location>

<Location /api/v1/>
    SSLRequireSSL
</Location>
