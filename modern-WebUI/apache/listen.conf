Listen 80
Listen 443
<VirtualHost _default_:80>
	RewriteEngine On
	RewriteRule ^/?\.well-known/acme-challenge/ - [L]
	RewriteRule ^(.*)$ $1 [R]
	RewriteRule ^http://(.*)$ https://$1 [L]
</VirtualHost>
SSLProtocol all -SSLv2 -SSLv3
SSLCipherSuite ALL:!ADH:!EXPORT56:RC4+RSA:+HIGH:+MEDIUM:+LOW:+EXP:+eNULL
